    <style>

        }
        
        .brand-header { text-align: center; margin-bottom: 25px; }
        .brand-header h1 { 
            font-size: 28px; 
            margin: 0; 
            font-weight: 800; 
            letter-spacing: 1px; 
            background: linear-gradient(135deg, #fff7ad 0%, #ffa900 50%, #d4af37 100%);

        input { 
            width: 100%; 
            padding: 14px 16px; 
            border-radius: 12px; 
            border: 1px solid #52525b;

            font-weight: 800; 
            cursor: pointer; 
            margin-top: 15px;

            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3);

        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(245, 158, 11, 0.5); }

            padding: 20px; 
            border-radius: 16px; 
            text-align: center;

            margin-bottom: 15px;
        }
        .upi-id { color: #fbbf24; font-weight: 700; font-size: 18px; margin: 10px 0 4px 0; letter-spacing: 0.5px; }
        .qr-img { width: 180px; height: 180px; margin: 10px auto; border-radius: 12px; border: 3px solid #f59e0b; padding: 6px; background: #fff; display: block; box-shadow: 0 0 15px rgba(245, 158, 11, 0.2); }
        .amount-badge { background: rgba(245, 158, 11, 0.15); color: #fbbf24; font-weight: 700; padding: 6px 16px; border-radius: 20px; display: inline-block; font-size: 13px; border: 1px solid #f59e0b; }
        
        .secure-footer { text-align: center; font-size: 11px; color: #a1a1aa; margin-top: 20px; letter-spacing: 0.5px; }

</head>
<body>

<!-- Live AI Particle Animation Canvas -->
<canvas id="aiCanvas"></canvas>

<div class="saas-card">
    <div class="brand-header">
        <h1>R & AI AGENT</h1>
        <p>Autonomous AI Review & Reputation Engine</p>
    </div>
    
    <form id="saasForm">
        <div class="form-group">
            <label>Owner Full Name</label>
            <input type="text" id="ownerName" placeholder="e.g. Munaf Lal" required>
        </div>

        </div>

        <div class="form-group">

            <input type="text" id="category" placeholder="e.g. Fine Dining / Fashion / Mobile Store" required>
        </div>

        <div class="form-group">
            <label>Google Maps Location URL (या Place ID)</label>
            <input type="text" id="placeId" placeholder="https://maps.app.goo.gl/..." required>
        </div>

        <div class="form-group">
            <label>Owner Mobile Number</label>
            <input type="tel" id="mobile" placeholder="10 Digit Mobile Number" maxlength="10" required>
        </div>

        <!-- ₹799 Auto UPI Scanner -->
        <div class="payment-box">
            <div class="amount-badge">VIP Plan: ₹799 / Month</div>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=upi://pay?pa=lalmunaf447@oksbi%26pn=Munaf%20Lal%26am=799%26cu=INR" alt="UPI QR" class="qr-img">
            <div class="upi-id">lalmunaf447@oksbi</div>
            <p style="margin:0; font-size:12px; color:#a1a1aa;">Payee: Munaf Lal (Instant Auto-Pay)</p>
        </div>

        <button type="submit" class="btn-gold">I Have Paid ₹799 - Submit to WhatsApp 🚀</button>
    </form>

    <div class="secure-footer">
        🔒 256-Bit Encrypted Gold Standard AI Onboarding
    </div>
</div>

<script>
/* Live AI Neural Animation Canvas */
const canvas = document.getElementById('aiCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const particles = [];
const particleCount = 65;

for (let i = 0; i < particleCount; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 1.2,
        vy: (Math.random() - 0.5) * 1.2,
        radius: Math.random() * 2 + 1
    });
}

function animateAI() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    for (let i = 0; i < particleCount; i++) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#d4af37';
        ctx.fill();

        for (let j = i + 1; j < particleCount; j++) {
            let p2 = particles[j];
            let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (dist < 130) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(212, 175, 55, ${1 - dist / 130})`;
                ctx.lineWidth = 0.6;
                ctx.stroke();
            }
        }
    }
    requestAnimationFrame(animateAI);
}
animateAI();

/* Direct WhatsApp Form Submission */
document.getElementById('saasForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const ownerName = document.getElementById('ownerName').value.trim();
    const shopName = document.getElementById('shopName').value.trim();
    const category = document.getElementById('category').value.trim();
    const placeId = document.getElementById('placeId').value.trim();
    const mobile = document.getElementById('mobile').value.trim();

    if(mobile.length !== 10) {
        alert("Kripya sahi 10-digit mobile number darj karein!");
        return;
    }

    const adminWhatsApp = "919737828591"; // Aapka WhatsApp Number

    const msg = `🚀 *NEW LUXURY SAAS SUBSCRIPTION PAID*%0A%0A` +
                `👤 *Owner:* ${encodeURIComponent(ownerName)}%0A` +
                `🏪 *Shop Name:* ${encodeURIComponent(shopName)}%0A` +
                `🏷️ *Category:* ${encodeURIComponent(category)}%0A` +
                `📍 *Map Location URL:* ${encodeURIComponent(placeId)}%0A` +
                `📞 *Mobile:* ${encodeURIComponent(mobile)}%0A` +
                `💳 *Plan:* ₹799/month (Paid)%0A%0A` +
                `----------------------------------------%0A` +
                `⚡ *Action:* Open Admin Panel & Generate Standee!`;

    window.location.href = `https://wa.me/${adminWhatsApp}?text=${msg}`;
});
</script>

</body>
