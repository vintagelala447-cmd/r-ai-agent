<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R & AI AGENT | Autonomous AI Review SaaS</title>
    <style>
        * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        body { background: #070b19; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #070b19 75%); }
        
        .saas-card { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(56, 189, 248, 0.2); 
            padding: 30px; 
            border-radius: 24px; 
            width: 100%; 
            max-width: 480px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); 
        }
        
        .brand-header { text-align: center; margin-bottom: 25px; }
        .brand-header h1 { color: #38bdf8; font-size: 26px; margin: 0; font-weight: 800; letter-spacing: 0.5px; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand-header p { color: #94a3b8; font-size: 13px; margin-top: 6px; }

        .form-group { margin-bottom: 16px; }
        label { font-size: 13px; color: #cbd5e1; display: block; margin-bottom: 6px; font-weight: 500; }
        
        input { 
            width: 100%; 
            padding: 14px 16px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(15, 23, 42, 0.8); 
            color: #fff; 
            font-size: 15px; 
            transition: all 0.3s ease; 
        }
        input:focus { border-color: #38bdf8; outline: none; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }

        .btn-lux { 
            background: linear-gradient(135deg, #0284c7 0%, #6366f1 100%); 
            color: white; 
            border: none; 
            padding: 15px; 
            width: 100%; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px; 
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
        }
        .btn-lux:hover { opacity: 0.95; transform: translateY(-1px); }

        .otp-section, .payment-section { display: none; margin-top: 15px; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .payment-box { 
            background: rgba(15, 23, 42, 0.9); 
            border: 1px dashed rgba(245, 158, 11, 0.4); 
            padding: 20px; 
            border-radius: 16px; 
            text-align: center; 
            margin-top: 15px; 
        }
        .upi-id { color: #f59e0b; font-weight: 700; font-size: 17px; margin: 10px 0 4px 0; letter-spacing: 0.5px; }
        .qr-img { width: 180px; height: 180px; margin: 10px auto; border-radius: 12px; border: 3px solid #f59e0b; padding: 6px; background: #fff; display: block; }
        .amount-badge { background: rgba(16, 185, 129, 0.15); color: #34d399; font-weight: 700; padding: 6px 14px; border-radius: 20px; display: inline-block; font-size: 13px; border: 1px solid rgba(16, 185, 129, 0.3); }
        
        .secure-footer { text-align: center; font-size: 11px; color: #64748b; margin-top: 20px; }
    </style>
</head>
<body>

<div class="saas-card">
    <div class="brand-header">
        <h1>R & AI AGENT</h1>
        <p>Autonomous AI Review & Reputation Engine</p>
    </div>
    
    <form id="saasForm">
        <!-- Step 1: Basic Details -->
        <div id="step1">
            <div class="form-group">
                <label>Owner Full Name</label>
                <input type="text" id="ownerName" placeholder="e.g. Munaf Lal" required>
            </div>

            <div class="form-group">
                <label>Shop / Business Name</label>
                <input type="text" id="shopName" placeholder="e.g. Tokyo Luxury Store" required>
            </div>

            <div class="form-group">
                <label>Business Category</label>
                <input type="text" id="category" placeholder="e.g. Fine Dining / Fashion / Electronics" required>
            </div>

            <div class="form-group">
                <label>Google Maps Location URL (या Place ID)</label>
                <input type="text" id="placeId" placeholder="https://maps.app.goo.gl/..." required>
            </div>

            <div class="form-group">
                <label>Owner Mobile Number</label>
                <input type="tel" id="mobile" placeholder="10 Digit Mobile Number" maxlength="10" required>
            </div>

            <button type="button" class="btn-lux" onclick="sendOtp()">Verify Mobile via OTP ➔</button>
        </div>

        <!-- Step 2: OTP Verification -->
        <div class="otp-section" id="step2">
            <div class="form-group">
                <label style="text-align:center; color:#38bdf8;">Enter 4-Digit Security OTP sent to mobile</label>
                <input type="text" id="otpInput" placeholder="Enter 1234" maxlength="4" style="text-align:center; font-size:20px; letter-spacing:8px;">
            </div>
            <button type="button" class="btn-lux" onclick="verifyOtp()">Confirm OTP & Unlock Payment</button>
        </div>

        <!-- Step 3: Payment & Final Submit -->
        <div class="payment-section" id="step3">
            <div class="payment-box">
                <div class="amount-badge">Subscription: ₹799/-</div>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=upi://pay?pa=lalmunaf447@oksbi%26pn=Munaf%20Lal%26am=799%26cu=INR" alt="UPI QR" class="qr-img">
                <div class="upi-id">lalmunaf447@oksbi</div>
                <p style="margin:0; font-size:12px; color:#94a3b8;">Payee: Munaf Lal (Instant Auto-Pay)</p>
            </div>

            <button type="submit" class="btn-lux" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">I Have Paid ₹799 - Activate Now 🚀</button>
        </div>
    </form>

    <div class="secure-footer">
        🔒 256-Bit Encrypted Secure AI Onboarding Gateway
    </div>
</div>

<script>
let verifiedMobile = "";

function sendOtp() {
    const mobile = document.getElementById('mobile').value.trim();
    if(mobile.length !== 10) {
        alert("Kripya sahi 10-digit mobile number darj karein!");
        return;
    }
    verifiedMobile = mobile;
    
    // Simulating secure OTP send (Demo OTP is 1234)
    alert("🔐 AI Security: Demo OTP '1234' aapke mobile par bheja gaya hai.");
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
}

function verifyOtp() {
    const otp = document.getElementById('otpInput').value.trim();
    if(otp !== "1234") {
        alert("Galat OTP! Kripya '1234' darj karein.");
        return;
    }
    
    alert("✅ Mobile Number Verified Successfully!");
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step3').style.display = 'block';
}

document.getElementById('saasForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const ownerName = document.getElementById('ownerName').value;
    const shopName = document.getElementById('shopName').value;
    const category = document.getElementById('category').value;
    const placeId = document.getElementById('placeId').value;
    const mobile = verifiedMobile;

    const adminWhatsApp = "919737828591"; // Aapka WhatsApp Number

    // Ultra clean format for your WhatsApp
    const msg = `🚀 *NEW LUXURY SAAS SUBSCRIPTION PAID*%0A%0A` +
                `👤 *Owner:* ${encodeURIComponent(ownerName)}%0A` +
                `🏪 *Shop Name:* ${encodeURIComponent(shopName)}%0A` +
                `🏷️ *Category:* ${encodeURIComponent(category)}%0A` +
                `📍 *Map Location URL:* ${encodeURIComponent(placeId)}%0A` +
                `📞 *Mobile:* ${encodeURIComponent(mobile)}%0A` +
                `💳 *Plan:* ₹799/month (Paid & OTP Verified)%0A%0A` +
                `----------------------------------------%0A` +
                `⚡ *Action:* Open Admin Panel & Generate Standee!`;

    // Direct redirection to your WhatsApp
    window.location.href = `https://wa.me/${adminWhatsApp}?text=${msg}`;
});
</script>

</body>
</html>
