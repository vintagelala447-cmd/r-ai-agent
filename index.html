<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R & AI AGENT - Onboarding</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { color: #38bdf8; text-align: center; margin-top: 0; }
        label { font-size: 14px; color: #94a3b8; display: block; margin-top: 12px; margin-bottom: 4px; }
        input, textarea, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; }
        input:focus { border-color: #38bdf8; outline: none; }
        .btn { background: #0284c7; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .btn:hover { background: #0369a1; }
        .payment-box { background: #0f172a; border: 1px dashed #38bdf8; padding: 15px; border-radius: 8px; text-align: center; margin-top: 15px; }
        .upi-id { color: #f59e0b; font-weight: bold; font-size: 18px; margin: 5px 0; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 R & AI AGENT Setup</h2>
    <p style="text-align:center; font-size: 14px; color: #cbd5e1;">Google Map AI Review QR System (₹499/month)</p>
    
    <form id="onboardForm">
        <label>Shop / Business Name</label>
        <input type="text" id="shopName" placeholder="e.g. Tokyo Fashion" required>

        <label>Google Place ID (या Direct Review Link)</label>
        <input type="text" id="placeId" placeholder="ChIJ... ya Google Maps Direct Link" required>

        <label>Owner Mobile Number</label>
        <input type="tel" id="mobile" placeholder="10 Digit Number" required>

        <div class="payment-box">
            <p style="margin:0; font-size:14px; color:#cbd5e1;">Pay Subscription Fee (₹499)</p>
            <div class="upi-id">lalmunaf447@oksbi</div>
            <p style="margin:0; font-size:12px; color:#94a3b8;">Payee Name: Munaf Lal</p>
        </div>

        <label>Payment UTR / Transaction Reference ID</label>
        <input type="text" id="utr" placeholder="12 Digit UTR Number" required>

        <button type="submit" class="btn">Submit & Request Activation</button>
    </form>
</div>

<script>
document.getElementById('onboardForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const shopData = {
        id: 'shop_' + Date.now(),
        shopName: document.getElementById('shopName').value,
        placeId: document.getElementById('placeId').value,
        mobile: document.getElementById('mobile').value,
        utr: document.getElementById('utr').value,
        status: 'Pending',
        timestamp: new Date().toISOString()
    };

    let requests = JSON.parse(localStorage.getItem('rai_requests') || '[]');
    requests.push(shopData);
    localStorage.setItem('rai_requests', JSON.stringify(requests));

    alert('Request Submitted Successfully! Admin verification ke baad aapka QR Stand generate ho jayega.');
    this.reset();
});
</script>

</body>
</html>
