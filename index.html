<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R & AI AGENT - Onboarding & Standee Download</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; margin-bottom: 25px; }
        h2, h3 { color: #38bdf8; text-align: center; margin-top: 0; }
        label { font-size: 14px; color: #94a3b8; display: block; margin-top: 12px; margin-bottom: 4px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; }
        input:focus { border-color: #38bdf8; outline: none; }
        .btn { background: #0284c7; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .btn:hover { background: #0369a1; }
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; }
        .payment-box { background: #0f172a; border: 1px dashed #38bdf8; padding: 15px; border-radius: 12px; text-align: center; margin-top: 15px; }
        .upi-id { color: #f59e0b; font-weight: bold; font-size: 18px; margin: 8px 0; }
        .qr-img { width: 190px; height: 190px; margin: 10px auto; border-radius: 10px; border: 2px solid #38bdf8; padding: 6px; background: #fff; display: block; }
        .amount-tag { background: #10b981; color: #fff; font-weight: bold; padding: 4px 10px; border-radius: 20px; display: inline-block; font-size: 13px; margin-bottom: 8px; }

        /* Designed Standee Frame */
        #standeeWrapper { display: none; margin-top: 20px; text-align: center; }
        .designer-card {
            background: linear-gradient(180deg, #0284c7 0%, #0f172a 40%, #1e293b 100%);
            border: 4px solid #f59e0b;
            border-radius: 24px;
            padding: 30px 20px;
            width: 320px;
            margin: 0 auto;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
            color: white;
            position: relative;
        }
        .designer-card h2 { color: #ffffff; font-size: 24px; text-transform: uppercase; margin: 0 0 5px 0; text-shadow: 0 2px 4px rgba(0,0,0,0.5); word-break: break-word; }
        .designer-card p.tagline { color: #38bdf8; font-size: 13px; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        .designer-card .qr-box { background: #ffffff; padding: 15px; border-radius: 18px; display: inline-block; box-shadow: 0 10px 20px rgba(0,0,0,0.4); border: 2px solid #38bdf8; }
        .designer-card .qr-box img { width: 180px; height: 180px; display: block; }
        .designer-card p.footer { color: #f59e0b; font-size: 13px; font-weight: bold; margin: 20px 0 0 0; letter-spacing: 1px; }
        .btn-download-design { background: #10b981; color: white; border: none; padding: 14px 20px; border-radius: 10px; font-weight: bold; font-size: 15px; width: 100%; margin-top: 15px; cursor: pointer; box-shadow: 0 5px 15px rgba(16,185,129,0.4); }
    </style>
    <!-- Canvas Library for Standee PNG export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<!-- Onboarding Registration Form -->
<div class="card">
    <h2>🚀 R & AI AGENT Setup</h2>
    <p style="text-align:center; font-size: 14px; color: #cbd5e1;">Google Map AI Review QR System (₹799/-)</p>
    
    <form id="onboardForm">
        <label>Owner Name</label>
        <input type="text" id="ownerName" placeholder="e.g. Munaf Lal" required>

        <label>Shop / Business Name</label>
        <input type="text" id="shopName" placeholder="e.g. Tokyo Fashion" required>

        <label>Business Category</label>
        <input type="text" id="category" placeholder="e.g. Clothing / Salon / Mobile Store" required>

        <label>Google Place ID (या Direct Review Link)</label>
        <input type="text" id="placeId" placeholder="ChIJ... ya Google Maps Direct Link" required>

        <label>Owner Mobile Number</label>
        <input type="tel" id="mobile" placeholder="10 Digit Number" required>

        <!-- ₹799 UPI Payment QR Scanner -->
        <div class="payment-box">
            <span class="amount-tag">Scan to Pay ₹799</span>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=upi://pay?pa=lalmunaf447@oksbi%26pn=Munaf%20Lal%26am=799%26cu=INR" alt="UPI QR Scanner" class="qr-img">
            <div class="upi-id">lalmunaf447@oksbi</div>
            <p style="margin:0; font-size:12px; color:#94a3b8;">Payee Name: Munaf Lal</p>
        </div>

        <button type="submit" class="btn">Submit & Request Activation</button>
    </form>
</div>

<!-- Search & Download Standee Section -->
<div class="card">
    <h3>🎨 Search & Download Designer AI Standee</h3>
    <p style="text-align:center; font-size: 13px; color: #94a3b8;">Registered Mobile Number se apna Ready Standee Card dekhein:</p>
    
    <input type="tel" id="searchMobile" placeholder="Registered Mobile Number">
    <button class="btn btn-success" onclick="checkStatus()">Search Designer Standee</button>

    <div id="standeeWrapper">
        <div class="designer-card" id="captureCard">
            <h2 id="cardShopTitle">SHOP NAME</h2>
            <p class="tagline">⭐ Scan to Write 5-Star AI Review ⭐</p>
            <div class="qr-box">
                <img id="cardQrCodeImg" src="" crossorigin="anonymous" alt="AI Review QR Code">
            </div>
            <p class="footer">POWERED BY R & AI AGENT</p>
        </div>

        <button class="btn-download-design" onclick="downloadStandeeImage()">📥 Download High Quality Standee (PNG)</button>
    </div>
</div>

<script>
document.getElementById('onboardForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const shopData = {
        id: 'shop_' + Date.now(),
        ownerName: document.getElementById('ownerName').value,
        shopName: document.getElementById('shopName').value,
        category: document.getElementById('category').value,
        placeId: document.getElementById('placeId').value,
        mobile: document.getElementById('mobile').value.trim(),
        status: 'Pending',
        timestamp: new Date().toISOString()
    };

    let requests = JSON.parse(localStorage.getItem('rai_requests') || '[]');
    requests.push(shopData);
    localStorage.setItem('rai_requests', JSON.stringify(requests));

    alert('Request Submitted Successfully! Payment verify hone ke baad mobile number se Designer Standee download kar sakte hain.');
    this.reset();
});

function checkStatus() {
    const mobile = document.getElementById('searchMobile').value.trim();
    if(!mobile) {
        alert("Kripya apna mobile number darj karein!");
        return;
    }

    let requests = JSON.parse(localStorage.getItem('rai_requests') || '[]');
    const matchedShop = requests.find(r => r.mobile === mobile);

    if(!matchedShop) {
        alert("Is Mobile Number se koi registration nahi mila!");
        document.getElementById('standeeWrapper').style.display = 'none';
        return;
    }

    if(matchedShop.status !== 'Active') {
        alert("Aapka account abhi Pending hai! Admin verification ke baad Designer Standee show ho jayega.");
        document.getElementById('standeeWrapper').style.display = 'none';
        return;
    }

    const reviewUrl = `https://vintagelala447-cmd.github.io/r-ai-agent/review.html?shop=${encodeURIComponent(matchedShop.shopName)}&placeid=${encodeURIComponent(matchedShop.placeId)}`;
    const qrCodeApi = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(reviewUrl)}`;

    document.getElementById('cardShopTitle').innerText = matchedShop.shopName;
    document.getElementById('cardQrCodeImg').src = qrCodeApi;
    document.getElementById('standeeWrapper').style.display = 'block';
}

function downloadStandeeImage() {
    const card = document.getElementById('captureCard');
    html2canvas(card, { scale: 3, useCORS: true }).then(canvas => {
        const link = document.createElement('a');
        link.download = `${document.getElementById('cardShopTitle').innerText}_AI_Standee.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
}
</script>

</body>
</html>
