<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R & AI AGENT - Onboarding</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { color: #38bdf8; text-align: center; margin-top: 0; }
        label { font-size: 14px; color: #94a3b8; display: block; margin-top: 12px; margin-bottom: 4px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; }
        input:focus { border-color: #38bdf8; outline: none; }
        .btn { background: #0284c7; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .payment-box { background: #0f172a; border: 1px dashed #38bdf8; padding: 15px; border-radius: 12px; text-align: center; margin-top: 15px; }
        .upi-id { color: #f59e0b; font-weight: bold; font-size: 18px; margin: 8px 0; }
        .qr-img { width: 190px; height: 190px; margin: 10px auto; border-radius: 10px; border: 2px solid #38bdf8; padding: 6px; background: #fff; display: block; }
        .amount-tag { background: #10b981; color: #fff; font-weight: bold; padding: 4px 10px; border-radius: 20px; display: inline-block; font-size: 13px; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 R & AI AGENT Setup</h2>
    <p style="text-align:center; font-size: 14px; color: #cbd5e1;">Google Map AI Review QR System (₹799/month)</p>
    
    <form id="onboardForm">
        <label>Owner Name</label>
        <input type="text" id="ownerName" placeholder="e.g. Munaf Lal" required>

        <label>Shop / Business Name</label>
        <input type="text" id="shopName" placeholder="e.g. Tokyo Fashion" required>

        <label>Business Category</label>
        <input type="text" id="category" placeholder="e.g. Clothing / Salon / Mobile Store" required>

        <label>Google Place ID (या Direct Review Link)</label>
        <input type="text" id="placeId" placeholder="ChIJ... ya Google Maps Direct Link" required>

        <label>Owner Mobile Number</label>
        <input type="tel" id="mobile" placeholder="10 Digit Number" required>

        <div class="payment-box">
            <span class="amount-tag">Scan to Pay ₹799</span>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=upi://pay?pa=lalmunaf447@oksbi%26pn=Munaf%20Lal%26am=799%26cu=INR" alt="UPI QR Scanner" class="qr-img">
            <div class="upi-id">lalmunaf447@oksbi</div>
            <p style="margin:0; font-size:12px; color:#94a3b8;">Payee Name: Munaf Lal</p>
        </div>

        <button type="submit" class="btn">Submit & Send to Admin WhatsApp</button>
    </form>
</div>

<script>
document.getElementById('onboardForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const ownerName = document.getElementById('ownerName').value;
    const shopName = document.getElementById('shopName').value;
    const category = document.getElementById('category').value;
    const placeId = document.getElementById('placeId').value;
    const mobile = document.getElementById('mobile').value;

    // Direct WhatsApp message logic (Replace with your mobile number)
    const adminWhatsAppNumber = "919000000000"; // <-- Yahan apna WhatsApp Number daalein (Country Code 91 ke saath)

    const message = `🚀 *New R & AI AGENT Registration*%0A%0A` +
                    `👤 *Owner:* ${encodeURIComponent(ownerName)}%0A` +
                    `🏪 *Shop:* ${encodeURIComponent(shopName)}%0A` +
                    `🏷️ *Category:* ${encodeURIComponent(category)}%0A` +
                    `📍 *Place ID/Link:* ${encodeURIComponent(placeId)}%0A` +
                    `📞 *Mobile:* ${encodeURIComponent(mobile)}%0A%0A` +
                    `💰 *Payment Status:* Paid ₹799 (Verify Pending)`;

    // Open WhatsApp Chat
    window.open(`https://wa.me/${adminWhatsAppNumber}?text=${message}`, '_blank');
});
</script>

</body>
</html>
