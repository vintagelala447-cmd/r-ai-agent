<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R & AI AGENT | Private Admin Panel</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background: #050505; 
            color: #f8fafc; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow-x: hidden;
            position: relative;
        }

        /* Live AI Particle Canvas Background */
        #aiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Luxurious Black & Gold Card */
        .saas-card { 
            position: relative;
            z-index: 2;
            background: rgba(15, 15, 15, 0.88); 
            backdrop-filter: blur(20px); 
            border: 1px solid #d4af37; 
            padding: 32px 28px; 
            border-radius: 24px; 
            width: 100%; 
            max-width: 480px; 
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.25), inset 0 0 15px rgba(212, 175, 55, 0.1); 
            margin-bottom: 25px;
        }
        
        .brand-header { text-align: center; margin-bottom: 25px; }
        .brand-header h1 { 
            font-size: 26px; 
            margin: 0; 
            font-weight: 800; 
            letter-spacing: 1px; 
            background: linear-gradient(135deg, #fff7ad 0%, #ffa900 50%, #d4af37 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-transform: uppercase;
        }
        .brand-header p { color: #d4d4d8; font-size: 13px; margin-top: 6px; letter-spacing: 0.5px; }

        .form-group { margin-bottom: 16px; }
        label { font-size: 13px; color: #fef08a; display: block; margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        
        input { 
            width: 100%; 
            padding: 14px 16px; 
            border-radius: 12px; 
            border: 1px solid #52525b; 
            background: rgba(24, 24, 27, 0.9); 
            color: #fff; 
            font-size: 15px; 
            transition: all 0.3s ease; 
        }
        input:focus { border-color: #f59e0b; outline: none; box-shadow: 0 0 12px rgba(245, 158, 11, 0.4); }

        .btn-gold { 
            background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%); 
            color: #000; 
            border: 1px solid #ffe4e6; 
            padding: 16px; 
            width: 100%; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 800; 
            cursor: pointer; 
            margin-top: 15px; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(245, 158, 11, 0.5); }

        /* Designed Black & Gold Standee Frame */
        #standeeWrapper { display: none; margin-top: 10px; text-align: center; z-index: 2; position: relative; }
        .designer-card {
            background: linear-gradient(180deg, #18181b 0%, #09090b 100%);
            border: 3px solid #d4af37;
            border-radius: 24px;
            padding: 30px 20px;
            width: 320px;
            margin: 0 auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 25px rgba(212, 175, 55, 0.2);
            color: white;
        }
        .designer-card h2 { 
            background: linear-gradient(135deg, #fff7ad 0%, #ffa900 50%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 22px; 
            font-weight: 800;
            text-transform: uppercase; 
            margin: 0 0 6px 0; 
            word-break: break-word; 
        }
        .designer-card p.tagline { color: #fef08a; font-size: 12px; font-weight: 700; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        .designer-card .qr-box { background: #ffffff; padding: 12px; border-radius: 18px; display: inline-block; border: 2px solid #d4af37; width: 204px; height: 204px; }
        .designer-card .qr-box img { width: 180px; height: 180px; display: block; }
        .designer-card p.footer { color: #d4af37; font-size: 12px; font-weight: 800; margin: 20px 0 0 0; letter-spacing: 1px; }
        
        .btn-download { 
            background: linear-gradient(135deg, #10b981 0%, #047857 100%); 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 12px; 
            font-weight: 800; 
            width: 100%; 
            max-width: 320px;
            margin-top: 15px; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            text-transform: uppercase;
        }
    </style>
    <!-- HTML2Canvas library for capturing crisp PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<!-- Live AI Particle Animation Canvas -->
<canvas id="aiCanvas"></canvas>

<div class="saas-card">
    <div class="brand-header">
        <h1>R & AI AGENT</h1>
        <p>Private Admin Standee Generator</p>
    </div>

    <div class="form-group">
        <label>Shop / Business Name</label>
        <input type="text" id="adminShopName" placeholder="e.g. THE PHONE SHOP">
    </div>

    <div class="form-group">
        <label>Google Maps Location URL (ya Place ID)</label>
        <input type="text" id="adminPlaceId" placeholder="https://maps.app.goo.gl/... ya Place ID">
    </div>

    <button class="btn-gold" onclick="generateInstantStandee()">⚡ Generate AI Standee Card</button>
</div>

<div id="standeeWrapper">
    <div class="designer-card" id="captureCard">
        <h2 id="cardShopTitle">SHOP NAME</h2>
        <p class="tagline">⭐ Scan to Write 5-Star AI Review ⭐</p>
        <div class="qr-box">
            <img id="cardQrCodeImg" crossorigin="anonymous" alt="AI Review QR">
        </div>
        <p class="footer">POWERED BY R & AI AGENT</p>
    </div>

    <button class="btn-download" onclick="downloadStandeeImage()">📥 Download Standee (PNG)</button>
</div>

<script>
/* Live AI Background Canvas */
const canvas = document.getElementById('aiCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const particles = [];
const particleCount = 60;

for (let i = 0; i < particleCount; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 1.2,
        vy: (Math.random() - 0.5) * 1.2,
        radius: Math.random() * 2 + 1
    });
}

function animateAI() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < particleCount; i++) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#d4af37';
        ctx.fill();

        for (let j = i + 1; j < particleCount; j++) {
            let p2 = particles[j];
            let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (dist < 130) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(212, 175, 55, ${1 - dist / 130})`;
                ctx.lineWidth = 0.6;
                ctx.stroke();
            }
        }
    }
    requestAnimationFrame(animateAI);
}
animateAI();

/* Standee Generator Logic */
let isQrLoaded = false;

function generateInstantStandee() {
    const shop = document.getElementById('adminShopName').value.trim();
    const placeid = document.getElementById('adminPlaceId').value.trim();

    if(!shop || !placeid) {
        alert("Shop Name aur Place ID / Location URL dono bharein!");
        return;
    }

    const reviewUrl = `https://vintagelala447-cmd.github.io/r-ai-agent/review.html?shop=${encodeURIComponent(shop)}&placeid=${encodeURIComponent(placeid)}`;
    const qrApi = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(reviewUrl)}`;

    const qrImg = document.getElementById('cardQrCodeImg');
    isQrLoaded = false;
    
    qrImg.onload = function() {
        isQrLoaded = true;
    };
    qrImg.src = qrApi;

    document.getElementById('cardShopTitle').innerText = shop;
    document.getElementById('standeeWrapper').style.display = 'block';
}

function downloadStandeeImage() {
    if(!isQrLoaded) {
        alert("Kripya 2 second rukein, QR code load ho raha hai...");
        return;
    }

    const card = document.getElementById('captureCard');
    html2canvas(card, { scale: 3, useCORS: true, allowTaint: false }).then(canvas => {
        const link = document.createElement('a');
        link.download = `${document.getElementById('cardShopTitle').innerText}_AI_Standee.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
}
</script>

</body>
</html>
