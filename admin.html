<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R & AI AGENT - Admin QR Generator</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; margin-bottom: 25px; }
        h2 { color: #38bdf8; text-align: center; margin-top: 0; }
        label { font-size: 14px; color: #94a3b8; display: block; margin-top: 12px; margin-bottom: 4px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; }
        .btn { background: #10b981; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }

        /* Designed Standee Card Frame */
        #standeeWrapper { display: none; margin-top: 20px; text-align: center; }
        .designer-card {
            background: linear-gradient(180deg, #0284c7 0%, #0f172a 40%, #1e293b 100%);
            border: 4px solid #f59e0b;
            border-radius: 24px;
            padding: 30px 20px;
            width: 320px;
            margin: 0 auto;
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
            color: white;
        }
        .designer-card h2 { color: #ffffff; font-size: 24px; text-transform: uppercase; margin: 0 0 5px 0; word-break: break-word; }
        .designer-card p.tagline { color: #38bdf8; font-size: 13px; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; }
        .designer-card .qr-box { background: #ffffff; padding: 12px; border-radius: 18px; display: inline-block; border: 2px solid #38bdf8; width: 204px; height: 204px; }
        .designer-card .qr-box img { width: 180px; height: 180px; display: block; }
        .designer-card p.footer { color: #f59e0b; font-size: 13px; font-weight: bold; margin: 20px 0 0 0; }
        .btn-download { background: #10b981; color: white; border: none; padding: 14px 20px; border-radius: 10px; font-weight: bold; width: 100%; margin-top: 15px; cursor: pointer; }
    </style>
    <!-- Library for Image Canvas Capture -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="card">
    <h2>🛡️ Admin Verified Standee Generator</h2>
    
    <label>Shop / Business Name</label>
    <input type="text" id="adminShopName" placeholder="e.g. THE PHONE SHOP">

    <label>Google Place ID or Direct Review Link</label>
    <input type="text" id="adminPlaceId" placeholder="ChIJ... ya direct review link">

    <button class="btn" onclick="generateInstantStandee()">⚡ Generate AI Standee Card</button>
</div>

<div id="standeeWrapper">
    <div class="designer-card" id="captureCard">
        <h2 id="cardShopTitle">SHOP NAME</h2>
        <p class="tagline">⭐ Scan to Write 5-Star AI Review ⭐</p>
        <div class="qr-box">
            <!-- Using direct encoded data URI / API with crossorigin support -->
            <img id="cardQrCodeImg" crossorigin="anonymous" alt="AI Review QR">
        </div>
        <p class="footer">POWERED BY R & AI AGENT</p>
    </div>

    <button class="btn-download" onclick="downloadStandeeImage()">📥 Download High Quality Standee (PNG)</button>
</div>

<script>
let isQrLoaded = false;

function generateInstantStandee() {
    const shop = document.getElementById('adminShopName').value.trim();
    const placeid = document.getElementById('adminPlaceId').value.trim();

    if(!shop || !placeid) {
        alert("Shop Name aur Place ID dono fill karein!");
        return;
    }

    const reviewUrl = `https://vintagelala447-cmd.github.io/r-ai-agent/review.html?shop=${encodeURIComponent(shop)}&placeid=${encodeURIComponent(placeid)}`;
    
    // Using a reliable robust QR generator API endpoint
    const qrApi = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(reviewUrl)}`;

    const qrImg = document.getElementById('cardQrCodeImg');
    isQrLoaded = false;
    
    qrImg.onload = function() {
        isQrLoaded = true;
    };
    qrImg.src = qrApi;

    document.getElementById('cardShopTitle').innerText = shop;
    document.getElementById('standeeWrapper').style.display = 'block';
}

function downloadStandeeImage() {
    if(!isQrLoaded) {
        alert("Kripya 2 second rukein, QR code load ho raha hai...");
        return;
    }

    const card = document.getElementById('captureCard');
    html2canvas(card, { scale: 3, useCORS: true, allowTaint: false }).then(canvas => {
        const link = document.createElement('a');
        link.download = `${document.getElementById('cardShopTitle').innerText}_AI_Standee.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
}
</script>

</body>
</html>
