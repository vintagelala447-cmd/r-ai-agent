<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R & AI AGENT - Private Admin</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h2 { color: #38bdf8; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e293b; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #38bdf8; }
        .btn-verify { background: #10b981; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; }
        .btn-qr { background: #0284c7; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; }
        .badge-pending { background: #f59e0b; color: #000; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-active { background: #10b981; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛡️ R & AI AGENT - Admin Verification Panel</h2>
    
    <table>
        <thead>
            <tr>
                <th>Shop Name</th>
                <th>Mobile</th>
                <th>UTR ID</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="requestTable">
            <!-- Dynamic Data -->
        </tbody>
    </table>
</div>

<script>
function renderRequests() {
    const table = document.getElementById('requestTable');
    let requests = JSON.parse(localStorage.getItem('rai_requests') || '[]');
    table.innerHTML = '';

    if(requests.length === 0) {
        table.innerHTML = '<tr><td colspan="5" style="text-align:center;">Koi pending request nahi hai.</td></tr>';
        return;
    }

    requests.forEach((req, index) => {
        const reviewUrl = `https://vintagelala447-cmd.github.io/r-ai-agent/review.html?shop=${encodeURIComponent(req.shopName)}&placeid=${encodeURIComponent(req.placeId)}`;
        const qrCodeApi = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(reviewUrl)}`;

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><strong>${req.shopName}</strong></td>
            <td>${req.mobile}</td>
            <td><code>${req.utr}</code></td>
            <td><span class="${req.status === 'Active' ? 'badge-active' : 'badge-pending'}">${req.status}</span></td>
            <td>
                ${req.status === 'Pending' ? `<button class="btn-verify" onclick="verifyShop(${index})">Verify & Activate</button>` : ''}
                ${req.status === 'Active' ? `<a href="${qrCodeApi}" target="_blank" class="btn-qr">Download QR Card</a>` : ''}
            </td>
        `;
        table.appendChild(tr);
    });
}

function verifyShop(index) {
    let requests = JSON.parse(localStorage.getItem('rai_requests') || '[]');
    requests[index].status = 'Active';
    localStorage.setItem('rai_requests', JSON.stringify(requests));
    renderRequests();
}

renderRequests();
</script>

</body>
</html>
