<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Review Assistant</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h3 { color: #38bdf8; margin-top: 0; }
        .chip-container { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 15px 0; }
        .chip { background: #0f172a; border: 1px solid #475569; padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .chip.selected { background: #0284c7; border-color: #38bdf8; color: white; }
        textarea { width: 100%; height: 110px; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; margin-top: 10px; resize: none; }
        .btn { background: #10b981; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h3 id="displayShopName">Store Review</h3>
    <p style="font-size: 13px; color: #94a3b8;">Select your experience to generate 5-Star Review:</p>

    <div class="chip-container" id="chipBox">
        <div class="chip selected" onclick="toggleChip(this)">Great Quality</div>
        <div class="chip selected" onclick="toggleChip(this)">Excellent Service</div>
        <div class="chip" onclick="toggleChip(this)">Best Prices</div>
        <div class="chip" onclick="toggleChip(this)">Polite Staff</div>
        <div class="chip" onclick="toggleChip(this)">Highly Recommended</div>
    </div>

    <textarea id="reviewText" readonly></textarea>

    <button class="btn" onclick="submitAndOpenGoogle()">Copy Review & Post on Google Maps</button>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const shopName = urlParams.get('shop') || 'Store';
const placeId = urlParams.get('placeid') || '';

document.getElementById('displayShopName').innerText = shopName;

function toggleChip(element) {
    element.classList.toggle('selected');
    generateAIReview();
}

function generateAIReview() {
    const selectedChips = Array.from(document.querySelectorAll('.chip.selected')).map(c => c.innerText);
    if(selectedChips.length === 0) {
        document.getElementById('reviewText').value = `Had a great experience at ${shopName}! Highly recommended.`;
        return;
    }
    document.getElementById('reviewText').value = `Visited ${shopName} today. ${selectedChips.join(', ')}. Loved the overall experience and atmosphere!`;
}

generateAIReview();

function submitAndOpenGoogle() {
    const text = document.getElementById('reviewText').value;

    // Automatic Clipboard Copy
    navigator.clipboard.writeText(text).then(() => {
        alert("✅ Review text copy ho gaya hai!\n\nGoogle Maps khulte hi long-press karke PASTE karein aur POST dabayein.");
        
        // Direct Write-Review Link (Opens 2nd Photo Layout with 5 Stars)
        let googleReviewUrl = `https://search.google.com/local/writereview?placeid=${placeId}`;
        
        if(!placeId || placeId.startsWith('http')) {
            googleReviewUrl = placeId || `https://www.google.com/search?q=${encodeURIComponent(shopName)}`;
        }

        window.location.href = googleReviewUrl;
    }).catch(() => {
        // Fallback redirect
        window.location.href = `https://search.google.com/local/writereview?placeid=${placeId}`;
    });
}
</script>

</body>
</html>
