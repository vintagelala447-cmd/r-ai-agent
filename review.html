<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R & AI AGENT - Leave a Review</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-3xl shadow-xl max-w-md w-full p-6 text-center border">
    
    <div class="mb-4">
      <span class="bg-indigo-100 text-indigo-700 text-[10px] font-extrabold px-3 py-1 rounded-full uppercase tracking-wider">R & AI AGENT</span>
      <h2 class="text-2xl font-black text-gray-800 mt-2" id="displayShopName">Shop Name</h2>
      <p class="text-xs text-gray-500 font-medium" id="displayCategory">Category</p>
    </div>

    <div class="flex justify-center text-yellow-400 text-3xl mb-5 space-x-1">
      ★ ★ ★ ★ ★
    </div>

    <p class="text-xs font-bold text-gray-600 mb-3 uppercase tracking-wide">Apna Experience Select Karein</p>

    <div class="flex flex-wrap gap-2 justify-center mb-6" id="tagsContainer"></div>

    <div class="bg-indigo-50/60 border border-indigo-100 rounded-2xl p-4 mb-6 text-left min-h-[90px] flex items-center justify-center">
      <p id="reviewText" class="text-gray-600 text-sm italic text-center font-medium">
        Upar kisi bhi topic par click karke AI review generate karein!
      </p>
    </div>

    <button onclick="submitToGoogleMaps()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
      ⭐ Copy Review & Post on Google Maps
    </button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const shopName = urlParams.get('shop') || "Our Shop";
    const category = urlParams.get('category') || "General Store";
    const mapUrl = urlParams.get('map') || "https://maps.google.com";

    document.getElementById('displayShopName').innerText = shopName;
    document.getElementById('displayCategory').innerText = category;

    let defaultTags = ["Best Quality", "Affordable Price", "Polite Staff", "Great Experience", "Fast Service"];

    if (category.includes("Mobile")) {
      defaultTags = ["Original Products", "Best Mobile Deals", "Helpful Staff", "Fast Repair", "Great Experience"];
    } else if (category.includes("Clothing")) {
      defaultTags = ["Latest Fashion", "Best Fabric Quality", "Affordable Prices", "Polite Staff", "Highly Recommended"];
    } else if (category.includes("Salon")) {
      defaultTags = ["Professional Haircut", "Clean & Hygienic", "Great Styling", "Polite Staff", "Best Service"];
    } else if (category.includes("Interior")) {
      defaultTags = ["Premium Quality", "Modern Designs", "Durable Materials", "Best Rates", "Excellent Service"];
    }

    const tagsContainer = document.getElementById('tagsContainer');
    let selectedTags = [];

    defaultTags.forEach(tag => {
      const btn = document.createElement('button');
      btn.innerText = tag;
      btn.className = "border border-gray-300 rounded-full px-3.5 py-1.5 text-xs font-semibold text-gray-700 hover:bg-indigo-50 transition";
      btn.onclick = () => toggleTag(btn, tag);
      tagsContainer.appendChild(btn);
    });

    function toggleTag(btn, tag) {
      if (selectedTags.includes(tag)) {
        selectedTags = selectedTags.filter(t => t !== tag);
        btn.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-600');
        btn.classList.add('border-gray-300', 'text-gray-700');
      } else {
        selectedTags.push(tag);
        btn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600');
        btn.classList.remove('border-gray-300', 'text-gray-700');
      }
      generateAIReview();
    }

    function generateAIReview() {
      const reviewBox = document.getElementById('reviewText');
      if (selectedTags.length === 0) {
        reviewBox.innerText = "Upar kisi bhi topic par click karke AI review generate karein!";
        return;
      }

      const reviews = [
        `${shopName} par mera experience bohot shandar raha! Inka ${selectedTags.join(' aur ')} sach me lajawab hai. Must visit! ⭐⭐⭐⭐⭐`,
        `Highly recommended! ${shopName} ki service aur ${selectedTags.join(', ')} bohot acche hain. Top class service! ⭐⭐⭐⭐⭐`,
        `${shopName} is the best! Yahan ki sabse acchi baat inka ${selectedTags.join(' aur ')} hai. 5 stars from my side! ⭐⭐⭐⭐⭐`
      ];

      reviewBox.innerText = reviews[Math.floor(Math.random() * reviews.length)];
    }

    function submitToGoogleMaps() {
      const text = document.getElementById('reviewText').innerText;
      if (selectedTags.length === 0) {
        alert("Kripya kam se kam ek topic click karke review generate karein!");
        return;
      }

      navigator.clipboard.writeText(text).then(() => {
        alert("Review copy ho gaya hai! Google Maps khulte hi paste karke submit kar dein.");
        window.location.href = mapUrl;
      }).catch(() => {
        window.location.href = mapUrl;
      });
    }
  </script>
</body>
</html>
