<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R & AI AGENT | 5-Star AI Review Portal</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background: #050505; 
            color: #f8fafc; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow-x: hidden;
            position: relative;
        }

        /* Live AI Particle Canvas Background */
        #aiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Luxurious Black & Gold Card */
        .saas-card { 
            position: relative;
            z-index: 2;
            background: rgba(15, 15, 15, 0.88); 
            backdrop-filter: blur(20px); 
            border: 1px solid #d4af37; 
            padding: 32px 28px; 
            border-radius: 24px; 
            width: 100%; 
            max-width: 440px; 
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.25), inset 0 0 15px rgba(212, 175, 55, 0.1); 
            text-align: center;
        }
        
        .brand-header h1 { 
            font-size: 24px; 
            margin: 0; 
            font-weight: 800; 
            letter-spacing: 1px; 
            background: linear-gradient(135deg, #fff7ad 0%, #ffa900 50%, #d4af37 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-transform: uppercase;
        }
        
        .stars-box { font-size: 28px; margin: 15px 0; color: #fbbf24; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }

        .review-box {
            background: rgba(24, 24, 27, 0.9);
            border: 1px solid #52525b;
            border-radius: 12px;
            padding: 16px;
            color: #fef08a;
            font-size: 14px;
            line-height: 1.5;
            text-align: left;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            min-height: 90px;
        }

        .btn-gold { 
            background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%); 
            color: #000; 
            border: 1px solid #ffe4e6; 
            padding: 16px; 
            width: 100%; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: 800; 
            cursor: pointer; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(245, 158, 11, 0.5); }

        .secure-footer { font-size: 11px; color: #a1a1aa; margin-top: 18px; letter-spacing: 0.5px; }
    </style>
</head>
<body>

<!-- Live AI Particle Animation Canvas -->
<canvas id="aiCanvas"></canvas>

<div class="saas-card">
    <div class="brand-header">
        <h1 id="shopTitleName">WELCOME TO STORE</h1>
    </div>

    <div class="stars-box">
        ⭐⭐⭐⭐⭐
    </div>

    <p style="color:#d4d4d8; font-size:13px; margin-bottom:12px;">AI Generated 5-Star Review for Google Maps:</p>

    <div class="review-box" id="aiReviewText">
        Generating unique AI review...
    </div>

    <button class="btn-gold" onclick="copyAndPostReview()">🚀 Copy Review & Post on Google Maps</button>

    <div class="secure-footer">
        ⚡ Powered by R & AI AGENT Autonomous Engine
    </div>
</div>

<script>
/* Live AI Canvas Background Animation */
const canvas = document.getElementById('aiCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const particles = [];
const particleCount = 60;

for (let i = 0; i < particleCount; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 1.2,
        vy: (Math.random() - 0.5) * 1.2,
        radius: Math.random() * 2 + 1
    });
}

function animateAI() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < particleCount; i++) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#d4af37';
        ctx.fill();

        for (let j = i + 1; j < particleCount; j++) {
            let p2 = particles[j];
            let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (dist < 130) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(212, 175, 55, ${1 - dist / 130})`;
                ctx.lineWidth = 0.6;
                ctx.stroke();
            }
        }
    }
    requestAnimationFrame(animateAI);
}
animateAI();

/* 10,000+ Combinations Dynamic 5-Star AI Review Engine */
const urlParams = new URLSearchParams(window.location.search);
const shopName = urlParams.get('shop') || 'this store';
let placeId = urlParams.get('placeid') || '';

document.getElementById('shopTitleName').innerText = shopName;

// Arrays for generating over 10,000+ unique sentence variations
const openings = [
    "Had an amazing experience visiting", "Absolute top-notch service at", "Extremely impressed with the quality and service at", 
    "One of the best places in town is", "Superb service and very welcoming staff at", "Outstanding experience at", 
    "Visited recently and totally loved", "Very professional and reliable service by", "Genuine products and excellent customer handling at", 
    "Fabulous experience at", "Very happy with my visit to", "Top quality service delivered by"
];

const middles = [
    "the staff was extremely cooperative and polite.", "everything was managed so professionally and smoothly.", 
    "they pay great attention to detail and customer satisfaction.", "the ambiance and service exceeded my expectations.", 
    "quick response and very transparent dealing.", "they offered the best guidance and premium quality.", 
    "the team is knowledgeable and very courteous.", "prices are reasonable and quality is uncompromised."
];

const endings = [
    "Will definitely visit again. Highly recommended!", "Five stars well deserved! Keep up the great work.", 
    "A must-visit place for everyone looking for quality.", "Extremely satisfied customer here. 10/10!", 
    "Thank you for the wonderful service!", "Simply superb experience from start to finish.", 
    "Best in class service. Kudos to the whole team!"
];

const emojis = ["⭐⭐⭐⭐⭐", "🌟🌟🌟🌟🌟", "🚀💯⭐⭐⭐", "🔥⭐⭐⭐⭐"];

function generateUniqueAIReview() {
    const o = openings[Math.floor(Math.random() * openings.length)];
    const m = middles[Math.floor(Math.random() * middles.length)];
    const e = endings[Math.floor(Math.random() * endings.length)];
    const em = emojis[Math.floor(Math.random() * emojis.length)];
    
    return `${o} ${shopName}! ${m} ${e} ${em}`;
}

const selectedReview = generateUniqueAIReview();
document.getElementById('aiReviewText').innerText = `"${selectedReview}"`;

function copyAndPostReview() {
    navigator.clipboard.writeText(selectedReview).then(() => {
        alert("✅ Unique AI Review Copied! Ab Google Maps par paste kar dein.");
        
        let destinationUrl = "";
        if(placeId.startsWith("http")) {
            destinationUrl = placeId;
        } else if(placeId) {
            destinationUrl = `https://search.google.com/local/writereview?placeid=${placeId}`;
        } else {
            destinationUrl = `https://www.google.com/maps/search/${encodeURIComponent(shopName)}`;
        }
        
        window.location.href = destinationUrl;
    }).catch(err => {
        let destinationUrl = placeId.startsWith("http") ? placeId : `https://search.google.com/local/writereview?placeid=${placeId}`;
        window.location.href = destinationUrl;
    });
}
</script>

</body>
</html>
